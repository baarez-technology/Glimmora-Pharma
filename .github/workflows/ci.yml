name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The schema is postgresql (prisma/schema.prisma, and migration_lock.toml
    # agrees). The workflow used to set DATABASE_URL to a SQLite file while the
    # schema said postgresql, so `prisma migrate deploy` failed on the protocol
    # and BOTH jobs were permanently red — which is the state a red build gets
    # ignored in. A real Postgres service is the only thing that can validate
    # postgresql migrations.
    #
    # Never `prisma db push` against a shared database: it reconciles the whole
    # database to schema.prisma and drops the tables the FastAPI service owns.
    # `migrate deploy` is the only safe command, and it is what runs here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glimmora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/glimmora_ci
      NEXTAUTH_SECRET: "ci-only-secret-32-bytes-long-aaaaaa"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must satisfy engines.node (>=22.12 <25). This was pinned to 20,
          # below the declared floor, which is a separate way the same job
          # could not have passed.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Tracked-artifact guard
        run: npm run check:artifacts

      - name: Build
        run: npm run build

  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glimmora_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/glimmora_smoke
      NEXTAUTH_SECRET: "ci-only-secret-32-bytes-long-aaaaaa"
      NEXTAUTH_URL: "http://localhost:3000"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations + seed test DB
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
